# Privacy rules. Flat "key: value" lines only; unknown keys stop the run.

age_band_years: 5          # narrowest age band, such as 45-49 (a band always holds the true age)
age_band_max_years: 15     # widest band used when too many patients would stand out (see below)
min_group_size: 5          # a patient should share district, sex and age band with this many people
registry_per_patient: 4    # assumed people in the area for each patient in the data
small_group_percent: 20    # widen the bands until at most this share of patients is in a smaller group
age_top_code: 90           # ages from here upwards are written as "90+", and the DOB is removed
date_shift_max_days: 180   # every date of one patient moves by the same secret offset (never 0)
dob_mode: remove           # remove = no birth date | shift = same offset as visit dates | year
                           # (shift and year both reveal the birth year, undoing the age bands)
rare_diagnosis_patients: 1 # a diagnosis held by this many patients or fewer is suppressed (0 = off)
pin_prefix_digits: 3       # PIN 123456 becomes 123***
phone_hub_groups: 3        # a phone shared by this many different people links nobody
max_file_mb: 200           # larger files are quarantined to protect the memory budget
max_json_depth: 200        # deeper JSON is quarantined
name_model: indicbert      # learned check for names no rule found: off | perceptron | crf | indicbert
l_diversity: 0             # also widen bands until each (district, sex, band) group has this many diagnoses (0 = off)
rare_diagnosis_mode: suppress  # a rare code becomes R69 (suppress), its ICD-10 category, or its chapter range
age_partitioning: global   # global = one band width for everyone | mondrian = ranges per group of patients
name_matching: fuzzy       # fuzzy = also join name spellings that are nearly the same before linking
